[package]
name = "D2DCTool"
version = "2.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.18.1"
byteorder = "1.5.0"
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = "0.17.2"
walkdir = "2.5.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1.13.1"
zopfli = "0.8.3"
rayon = "1.12.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
